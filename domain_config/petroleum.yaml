# 测井/石油工程领域配置
# 术语白名单、实体类型、关系类型定义

domain:
  name: petroleum
  description: 测井分析与石油工程领域

# 专业术语白名单（用于 AC 自动机边界标记）
terminology:
  # 岩性
  - 砂岩
  - 泥岩
  - 页岩
  - 碳酸盐岩
  - 白云岩
  - 石灰岩
  - 砾岩
  - 火山岩
  - 变质岩
  - 有效储层
  - 致密储层
  - 烃源岩
  - 盖层
  # 测井
  - 自然伽马
  - 电阻率
  - 声波时差
  - 中子孔隙度
  - 密度测井
  - 自然电位
  - 井径
  - 深侧向电阻率
  - 浅侧向电阻率
  - 微球聚焦
  - 补偿中子
  - 岩性密度
  - 高分辨率阵列感应
  - 核磁共振测井
  - 偶极声波
  - 地层倾角
  # 设备
  - 潜油电泵
  - 离心机轴承
  - 高速离心机轴承
  - 离心机内部轴承
  - 螺杆泵
  - 抽油机
  - 防喷器
  - 井下安全阀
  - 封隔器
  - 射孔枪
  # 油气
  - 油气层
  - 油水界面
  - 气油比
  - 地层压力
  - 渗透率
  - 孔隙度
  - 饱和度
  - 泥质含量

# 实体类型白名单
entity_types:
  - 岩性
  - 设备
  - 油气层
  - 地层
  - 测井曲线
  - 操作步骤
  - 安全规范
  - 参数
  - 故障模式
  - 材料
  - 工艺
  - 井位
  - 层位
  - 测井仪器

# 关系类型白名单（含强制关系，LLM 提取时优先使用）
relation_types:
  # 强制关系 —— LLM 必须从以下选项中选择，不可自由编造关系名称
  mandatory:
    - 属于
    - 包含
    - 组成
    - 导致
    - 影响
    - 位于
    - 关联
    - 等价
    - 产生
    - 需要
    - 指示
  # 允许 LLM 自主发现的额外关系
  allow_free: true

# 消歧配置
disambiguation:
  coarse_similarity_threshold: 0.5
  high_freq_ratio: 3.0        # 高频词/低频词 > 此值 → 低频词可能是别名